<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パレット確認試作</title>
<meta name="theme-color" content="#14202b">
<style>
:root{--bg:#f4f6f8;--fg:#14202b;--sub:#5b6875;--line:#d5dbe1;--panel:#fff;--accent:#0b6bcb;--ok:#13804a;--ng:#c62828;--warn:#b26a00;--okbg:#e6f4ec;--ngbg:#fdecec;--warnbg:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--fg:#e6ebf0;--sub:#93a1ae;--line:#2a3640;--panel:#17212a;--accent:#5aa9f0;--ok:#4cc38a;--ng:#ef6b6b;--warn:#f0b04c;--okbg:#14301f;--ngbg:#3a1717;--warnbg:#3a2c12;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
 padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;flex:1;min-width:0}
.top #logout{order:-1}
.ver{color:var(--sub);font-size:10px}
.who{font-size:12px;color:var(--sub)}
.serial{display:flex;align-items:center;gap:6px;margin-top:4px}
.serial label{font-weight:bold}
.serial input{width:6.5em;font-size:22px;font-weight:bold;padding:4px 8px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);padding:6px}
.stage{position:relative;width:100%;height:min(44vh,430px);background:#000;border-radius:8px;overflow:hidden;margin-top:6px;border:4px solid #555;transition:border-color .2s}
.stage.qrok{border-color:#2e7d32}
.stage.qrng{border-color:#555}
video{display:block;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:5px;padding:5px;pointer-events:none}
.chip{flex:1;min-width:0;background:rgba(0,0,0,.62);color:#fff;border-radius:8px;padding:3px 7px;border-left:5px solid #999}
.chip.qr{border-left-color:#9e9e9e}.chip.num{border-left-color:#ef5350}.chip.ord{border-left-color:#42a5f5}
.chip .lb{font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{font-size:24px;font-weight:bold;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.fixed{background:rgba(19,128,74,.88)}
.chip.num,.chip.ord{pointer-events:auto;cursor:pointer}
.chip.manual{background:rgba(178,106,0,.92)}
.chip .tap{font-size:9px;opacity:.85}
#fix{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:58;width:min(92vw,340px);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#fix h3{margin:0 0 6px;font-size:16px}
#fix .cur{font-size:13px;color:var(--sub);margin-bottom:8px}
#fix .row{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:6px}
#fixGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:40vh;overflow:auto;margin-top:4px}
#fixGrid button{min-height:42px;padding:4px 0;font-size:17px;font-weight:bold}
#fixGrid button.sumi{border:2px solid var(--accent)}
#fixGrid button.other{background:var(--bg);color:var(--sub);text-decoration:line-through}
#fixGrid button.cur{background:var(--ok);border-color:var(--ok);color:#fff}
#fixLegend{font-size:11px;color:var(--sub);margin-top:4px;text-align:right}
#fix .note{font-size:12px;color:var(--sub);margin-top:6px;text-align:right}
.chip.qr.fixed{border-left-color:#a5d6a7}
.hudmsg{position:absolute;left:5px;right:5px;bottom:5px;background:rgba(0,0,0,.62);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;display:flex;gap:6px;align-items:center;pointer-events:none}
.hudmsg img{height:30px;background:#fff;border-radius:3px}
.hudmsg span{flex:1;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;justify-content:flex-end}
.btns .lnk{margin-right:auto}
button{font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px}
.panel h2{font-size:13px;margin:0 0 4px;color:var(--sub);font-weight:normal}
.ordrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ordrow select{flex:1;min-width:0;font-size:16px}
.ordbig{font-size:22px;font-weight:bold}
.meta{font-size:13px;color:var(--sub)}
.range{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;justify-content:flex-end}
.range input{width:4.2em;font-size:26px;font-weight:bold;text-align:center;padding:2px}
.range .cnt{font-size:18px;font-weight:bold}
.checks{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.checks li{border-radius:6px;padding:4px 8px;font-size:14px;border-left:5px solid var(--line);background:var(--bg)}
.checks li.ok{background:var(--okbg);border-left-color:var(--ok)}
.checks li.ng{background:var(--ngbg);border-left-color:var(--ng)}
.checks li.warn{background:var(--warnbg);border-left-color:var(--warn)}
.status{font-size:13px;color:var(--sub);min-height:1.4em}
.status.ng{color:var(--ng)}.status.ok{color:var(--ok)}
textarea{width:100%;min-height:48px;font-size:14px}
.recs{font-size:13px;margin:4px 0 0;padding-left:1.2em}
.qrline{font-size:12px;color:var(--sub);word-break:break-all;margin-top:4px}
details{margin-top:8px}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:11px;white-space:pre-wrap;max-height:30vh;overflow:auto;margin:0}
.hidden{display:none!important}
.statusLine{margin-top:8px;padding:8px;border-radius:6px;font-weight:bold;background:var(--bg);border-left:5px solid var(--line)}
.statusLine.ok{background:var(--okbg);border-left-color:var(--ok)}
.statusLine.ng{background:var(--ngbg);border-left-color:var(--ng)}
.statusLine small{display:block;font-weight:normal;color:var(--sub)}
button.danger{background:var(--ng);border-color:var(--ng);color:#fff}
#unconfReason{width:100%;margin-top:6px;font-size:15px}
#myRecs li.cancel{color:var(--ng)}
.ocrnote{background:var(--warnbg);border-left:5px solid var(--warn);border-radius:6px;padding:3px 8px;font-size:13px;color:var(--fg);margin-bottom:4px}
.confirm input:disabled+span{color:var(--sub);font-weight:normal}
button{transition:transform .06s,filter .06s}
button:active:not(:disabled){transform:scale(.95);filter:brightness(.88)}
button.running{background:#2e7d32;border-color:#2e7d32;color:#fff}
button.running:disabled,button.done:disabled,button.working:disabled{opacity:1}
button.done{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
button.working{opacity:1;background:#5b6875;border-color:#5b6875;color:#fff}
.spin{display:inline-block;width:1em;height:1em;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-.15em;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#busy{position:fixed;left:0;right:0;top:0;z-index:50;background:#14202b;color:#fff;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#busy .row{display:flex;align-items:center;gap:6px}
#busy .lbl{flex:1;min-width:0;font-weight:bold}
#busy .sec{font-variant-numeric:tabular-nums;font-size:18px;font-weight:bold}
#busy .bar{height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:5px;overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:#5aa9f0;transition:width .2s linear}
#busy .bar i.over{background:#f0b04c}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;min-width:min(86vw,360px);max-width:94vw;padding:14px 18px;border-radius:12px;color:#fff;font-size:18px;font-weight:bold;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast.ok{background:#13804a}#toast.ng{background:#c62828}#toast.info{background:#14202b}
#toast.ok,#toast.info{pointer-events:none}
#toast small{display:block;font-size:13px;font-weight:normal;opacity:.9;margin-top:2px}
.confirm{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;padding:8px;border-radius:6px;background:var(--bg);font-weight:bold}
.confirm input{width:26px;height:26px}
.lnk{align-self:center;color:var(--accent)}
</style>
</head>
<body>
<div id="busy" class="hidden"><div class="row"><span class="spin"></span><span class="lbl" id="busyLbl"></span><span class="sec" id="busySec"></span></div><div class="bar"><i id="busyBar"></i></div></div>
<div id="toast" class="hidden"></div>
<div id="fix" class="hidden">
 <h3 id="fixTitle"></h3><div class="cur" id="fixCur"></div>
 <div class="row"><button id="fixReread" class="primary">この項目だけ読み直す</button></div>
 <div id="fixManualRow"><div class="cur" id="fixGridHead"></div><div id="fixGrid"></div><div id="fixLegend">青枠: 住友リストのこの通番の範囲 / 取消線: ほかの通番で記録済み</div></div>
 <div class="note" id="fixNote"></div>
 <div class="row"><button id="fixClose">閉じる</button></div>
</div>
<div class="top">
 <h1>パレット確認(引っ越し用・試作)<div class="ver">第1.4版 / 2026-11-15 / 確認者の表示・確認の取消(履歴つき)</div></h1>
 <div class="who" id="who">未ログイン</div>
 <button id="logout" class="hidden">ログアウト</button>
</div>
<div class="serial"><label for="serial">通番</label><input id="serial" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1〜300"><span class="meta" id="serialInfo"></span></div>

<div class="stage qrng" id="stage"><video id="video" playsinline muted></video><canvas id="ov"></canvas>
 <div class="hud">
  <div class="chip qr" id="qrChip"><div class="lb">QR</div><div class="v" id="qrHud">未検出</div></div>
  <div class="chip num" id="numChip"><div class="lb">カートン番号</div><div class="v" id="numHud">-</div></div>
  <div class="chip ord" id="ordChip"><div class="lb">オーダー下4桁</div><div class="v" id="ordHud">-</div></div>
 </div>
 <div class="hudmsg"><img id="numMini" alt=""><img id="ordMini" alt=""><span id="hudMsg">「開始」を押してください。</span></div>
</div>
<div class="btns">
 <button id="stop">停止</button>
 <button id="rescan">全部読み直し</button>
 <button id="start" class="primary">開始</button>
</div>
<div class="status" id="status"></div>

<div class="panel" id="ordPanel">
 <h2>オーダー(QRの品番で絞込み → OCRの下4桁で仮選択。ラベルを見て、人が確定してください)</h2>
 <div class="ordrow"><select id="ordSel"><option value="">(QRを読むと候補が出ます)</option></select>
  <input id="ordManual" inputmode="numeric" maxlength="4" placeholder="下4桁" style="width:5em"></div>
 <div class="meta" id="ordMeta"></div>
 <div class="meta" id="sumiInfo"></div>
 <ul class="recs" id="otherRecs"></ul>
</div>

<div class="panel">
 <h2>このパレットに載っているカートン番号(連番の前提)</h2>
 <div class="range"><input id="from" inputmode="numeric" maxlength="2" placeholder="から"> 〜 <input id="to" inputmode="numeric" maxlength="2" placeholder="まで"> <span class="cnt" id="cnt"></span>
  <button id="useSumi" class="hidden">住友の範囲を入れる</button></div>
 <ul class="checks" id="checks"></ul>
 <details><summary>差異メモ(違いがあれば)</summary><textarea id="note" placeholder="例: 12番の箱が見当たらない / ラベル汚れ"></textarea></details>
 <label class="confirm"><input type="checkbox" id="confirmed"> <span id="confirmText">オーダーと範囲を入れると確認できます</span></label>
 <div class="btns"><a class="lnk" href="list.html" target="_blank">確認一覧</a><button id="next">次のパレット</button><button id="save" class="primary" disabled>記録する(未確認・差異あり)</button></div>
 <div class="status" id="saveStatus"></div>
 <div id="histBox" class="hidden">
  <div class="statusLine" id="histStatus"></div>
  <div class="unconf hidden" id="unconfBox">
   <div class="btns"><button id="unconfBtn">この通番の棚卸確認を取り消す</button></div>
   <div id="unconfAsk" class="hidden">
    <input id="unconfReason" placeholder="取消の理由(任意) 例: 数え直しが必要">
    <div class="btns"><button id="unconfNo">やめる</button><button id="unconfYes" class="danger">取り消す</button></div>
   </div>
  </div>
  <details><summary id="histSum">この通番の履歴</summary><ul class="recs" id="myRecs"></ul></details>
 </div>
</div>
<div class="qrline" id="qrLine"></div>

<details><summary>記録(動作ログ)</summary><pre id="log"></pre></details>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function(){
"use strict";
var API="https://script.google.com/macros/s/AKfycbyegIoGqW6QQdi3U4RpDKIk0b5EtnlWBiUMpWdm49dqfI1tMGsjLb-uPcuEbJ7EYInv7w/exec";
var TOKEN_KEY="qr_lookup_token_v1";
var $=function(id){return document.getElementById(id);};
var video=$("video"),ov=$("ov"),octx=ov.getContext("2d");
var full=document.createElement("canvas"),fctx=full.getContext("2d",{willReadFrequently:true});
var small=document.createElement("canvas"),sctx=small.getContext("2d",{willReadFrequently:true});
var stream=null,timer=null,busy=false,worker=null,workerReady=false,lastQuad=null,lastSeen=0;
var token=null,userName="",ORDERS=null;

/* ラベル上の位置(QRの一辺=1、QR左上が原点) */
var LABEL={u0:-6.2,v0:-0.6,u1:1.5,v1:4.4};
var BOX={num:{u0:-0.1,v0:2.4,u1:1.45,v1:3.6},ord:{u0:-0.9,v0:3.3,u1:0.5,v1:4.15}};
var NEED=3,PX=110;

var st; /* 読み取りの状態 */
var cur={order:null,info:null}; /* 選んだオーダーと、通番の情報 */
function resetScan(){st={qr:null,pq:null,votes:{num:{},ord:{}},fixed:{num:null,ord:null},manual:{num:false},qrAt:0};renderScan();}

function log(m){var p=$("log");var t=new Date().toLocaleTimeString("ja-JP",{hour12:false});p.textContent=t+" "+m+"\n"+p.textContent.slice(0,4000);}
function setStatus(t,c){var s=$("status");s.textContent=t;s.className="status "+(c||"");$("hudMsg").textContent=t;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- 待ち時間の表示 ---------- */
var LBL={whoami:"認証を確認中",candidates:"オーダー一覧を読込中",palletInfo:"通番の情報を確認中",saveRange:"記録中",unconfirm:"棚卸確認を取消中"};
var DEF={whoami:3,candidates:4,palletInfo:3,saveRange:5,unconfirm:5,ocr:8};
var tasks={},taskSeq=0,busyTimer=null;
function expectSec(k){try{var v=+localStorage.getItem("pallet_wait_"+k);if(v>0)return v;}catch(e){}return DEF[k]||4;}
function learn(k,sec){try{var o=expectSec(k);localStorage.setItem("pallet_wait_"+k,String(Math.round((o*0.6+sec*0.4)*10)/10));}catch(e){}}
function busyStart(k,label){var id=++taskSeq;tasks[id]={k:k,label:label,t0:performance.now(),exp:expectSec(k)};drawBusy();if(!busyTimer)busyTimer=setInterval(drawBusy,100);return id;}
function busyEnd(id,ok){var t=tasks[id];if(!t)return 0;var sec=(performance.now()-t.t0)/1000;if(ok)learn(t.k,sec);delete tasks[id];drawBusy();return sec;}
function drawBusy(){
  var ids=Object.keys(tasks);if(!ids.length){$("busy").classList.add("hidden");if(busyTimer){clearInterval(busyTimer);busyTimer=null;}return;}
  var t=tasks[ids[ids.length-1]];var sec=(performance.now()-t.t0)/1000;
  $("busy").classList.remove("hidden");
  $("busyLbl").textContent=t.label+"…"+(ids.length>1?"(ほか"+(ids.length-1)+"件)":"");
  $("busySec").textContent=sec.toFixed(1)+"秒 / 目安"+Math.round(t.exp)+"秒";
  var b=$("busyBar");var r=sec/t.exp;b.style.width=Math.min(100,r*100)+"%";b.className=r>1.3?"over":"";
  if(t.btn){t.btn.innerHTML='<span class="spin"></span>'+esc(t.btnText)+" "+sec.toFixed(1)+"秒";}
}
var toastTimer=null;
function toast(msg,kind,sub){
  var el=$("toast");el.className=kind||"info";el.innerHTML=esc(msg)+(sub?"<small>"+esc(sub)+"</small>":"");
  if(toastTimer)clearTimeout(toastTimer);
  if(navigator.vibrate)try{navigator.vibrate(kind==="ng"?[200,100,200]:kind==="ok"?80:30);}catch(e){}
  if(kind!=="ng")toastTimer=setTimeout(function(){el.classList.add("hidden");},kind==="ok"?3000:1800);
}
$("toast").addEventListener("click",function(){this.classList.add("hidden");});

function api(body,btn,btnText){
  body.token=token;
  var id=busyStart(body.action,LBL[body.action]||"通信中");
  if(btn){tasks[id].btn=btn;tasks[id].btnText=btnText||"処理中…";btn.disabled=true;btn.classList.add("working");drawBusy();}
  return fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(j){var sec=busyEnd(id,!!j.ok);if(btn)btn.classList.remove("working");j._sec=sec;return j;},
        function(e){busyEnd(id,false);if(btn)btn.classList.remove("working");throw e;});
}

/* ---------- ログイン ---------- */
function setLogin(name){
  userName=name||"";$("who").textContent=name?("担当: "+name):"未ログイン(本人用の認証QRを読んでください)";
  $("logout").classList.toggle("hidden",!name);
}
function tryToken(t){
  token=t;setStatus("認証を確認中…");
  return api({action:"whoami"}).then(function(j){
    if(!j.ok){token=null;try{localStorage.removeItem(TOKEN_KEY);}catch(e){}setLogin("");setStatus("認証QRが無効です。","ng");return false;}
    try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}
    setLogin(j.name);log("ログイン "+j.name);toast("ログインしました: "+j.name,"ok");loadOrders();return true;
  }).catch(function(e){setStatus("通信エラー: "+e.message,"ng");toast("通信エラー","ng","電波を確認して、もう一度お試しください。タップで閉じます");return false;});
}
function loadOrders(){
  setStatus("オーダー一覧を読込中…");
  return api({action:"candidates",pn:""}).then(function(j){
    if(!j.ok)throw new Error(j.error);ORDERS=j.orders;log("オーダー "+ORDERS.length+"件");
    setStatus("準備OK。通番を入れて、カートンラベルを枠に合わせてください。","ok");
    if(st.pq)fillOrders();
  }).catch(function(e){setStatus("オーダー一覧の読込に失敗: "+e.message,"ng");toast("オーダー一覧の読込に失敗","ng","タップで閉じます。画面を読み込み直してください");});
}
$("logout").addEventListener("click",function(){try{localStorage.removeItem(TOKEN_KEY);}catch(e){}token=null;ORDERS=null;setLogin("");});

/* ---------- QRの分解 ---------- */
function parseQR(t){
  t=String(t).trim().replace(/'+$/,"");
  var f=t.split(",");if(f.length<6)return null;
  var tail=f.slice(5).join(",");var lots=[],m,re=/(\d{6}-\d{4}):(\d+?)(?=\d{6}-\d{4}:|TOTAL:)/g;
  while((m=re.exec(tail)))lots.push(m[1]+"="+m[2]);
  var tot=(tail.match(/TOTAL:(\d+)/)||[])[1];
  return {id:f[0],dt:f[1],x3:f[2],pn:f[3],name:f[4],lots:lots,total:tot};
}

/* ---------- オーダーの候補 ---------- */
function fillOrders(){
  var sel=$("ordSel");if(!ORDERS)return;
  var pn=st.pq?st.pq.pn:"";var l4=st.fixed.ord||$("ordManual").value.replace(/\D/g,"");
  var list=ORDERS.filter(function(o){return !pn||o.pn===pn;});

function pad(c){var o=document.createElement("canvas");o.width=c.width+40;o.height=c.height+40;var x=o.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,o.width,o.height);x.drawImage(c,20,20);return o;}
/* 下4桁の候補: QRの品番で絞ったオーダーの下4桁 */
function cands(){if(!ORDERS||!st.pq)return [];return ORDERS.filter(function(o){return o.pn===st.pq.pn;}).map(function(o){return o.last4;});}
function judgeOrd(text){
  var lines=String(text).split(/\n/).map(function(l){return l.replace(/\D/g,"");}).filter(function(l){return l.length>=5;});
  if(!lines.length)return null;var cs=cands();
  /* 候補(品番で絞ったオーダー)に一致する行を優先し、なければ一番下の行の下4桁 */
  for(var i=lines.length-1;i>=0;i--){if(cs.indexOf(lines[i].slice(-4))>=0)return lines[i].slice(-4);}
  return lines[lines.length-1].slice(-4);
}
function judge(k,raw){
  if(k==="ord")return judgeOrd(raw);
  raw=raw.replace(/\s/g,"");var m=raw.match(/^\d{1,2}$/);if(!m)return null;var n=+m[0];return (n>=1&&n<=99)?String(n):null;
}
function ocrOne(k,c){
  var vars=[pad(c),pad(otsu(c))];
  return worker.setParameters({tessedit_pageseg_mode:k==="ord"?"6":"7"}).then(function(){return worker.recognize(vars[0]);}).then(function(r1){
    return worker.recognize(vars[1]).then(function(r2){return [r1.data.text,r2.data.text];});
  }).then(function(raws){
    raws.forEach(function(raw){var v=judge(k,raw);if(v){st.votes[k][v]=(st.votes[k][v]||0)+1;
      if(st.votes[k][v]>=NEED&&!st.fixed[k]){st.fixed[k]=v;log("確定 "+k+"="+v);
        if(k==="ord")fillOrders();check();}}});
    return raws;
  });
}
function prepWorker(){
  var t0=performance.now();
  return Tesseract.createWorker("eng",1,{langPath:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int",gzip:true})
  .then(function(w){worker=w;return w.setParameters({tessedit_char_whitelist:"0123456789",tessedit_pageseg_mode:"7"});})
  .then(function(){workerReady=true;log("文字認識 準備OK "+Math.round(performance.now()-t0)+"ms");});
}

/* ---------- 重ね描き ---------- */
function drawGuide(){
  var W=video.clientWidth,H=video.clientHeight;if(!W||!H)return;
  var dpr=window.devicePixelRatio||1;
  if(ov.width!==W*dpr||ov.height!==H*dpr){ov.width=W*dpr;ov.height=H*dpr;}
  octx.setTransform(dpr,0,0,dpr,0,0);octx.clearRect(0,0,W,H);
  if(!token)return; /* 認証QRを読むときは枠を出さない */
  var lw=LABEL.u1-LABEL.u0,lh=LABEL.v1-LABEL.v0;var top0=56,bot0=44;var s=Math.min(W*0.9/lw,(H-top0-bot0)*0.95/lh);
  var ox=(W-lw*s)/2-LABEL.u0*s,oy=top0+((H-top0-bot0)-lh*s)/2-LABEL.v0*s;
  function r(b,col,dash){octx.setLineDash(dash||[]);octx.strokeStyle=col;octx.lineWidth=2;octx.strokeRect(ox+b.u0*s,oy+b.v0*s,(b.u1-b.u0)*s,(b.v1-b.v0)*s);}
  r(LABEL,"rgba(255,255,255,.85)");r({u0:0,v0:0,u1:1,v1:1},"rgba(76,195,138,.95)");
  r(BOX.num,"rgba(239,83,80,.8)",[6,4]);r(BOX.ord,"rgba(66,165,245,.8)",[6,4]);octx.setLineDash([]);
  if(lastQuad&&video.videoWidth&&Date.now()-lastSeen<1500){
    var k=Math.max(W/video.videoWidth,H/video.videoHeight),dx=(W-video.videoWidth*k)/2,dy=(H-video.videoHeight*k)/2;
    var q=lastQuad;function P(u,v){return [(q[0].x+u*(q[1].x-q[0].x)+v*(q[3].x-q[0].x))*k+dx,(q[0].y+u*(q[1].y-q[0].y)+v*(q[3].y-q[0].y))*k+dy];}
    function poly(b,col,fill){var a=[P(b.u0,b.v0),P(b.u1,b.v0),P(b.u1,b.v1),P(b.u0,b.v1)];octx.beginPath();octx.moveTo(a[0][0],a[0][1]);for(var i=1;i<4;i++)octx.lineTo(a[i][0],a[i][1]);octx.closePath();if(fill){octx.fillStyle=fill;octx.fill();}octx.strokeStyle=col;octx.lineWidth=3;octx.stroke();}
    poly({u0:0,v0:0,u1:1,v1:1},"#4cc38a","rgba(76,195,138,.25)");poly(BOX.num,"#ef5350");poly(BOX.ord,"#42a5f5");
  }
}

/* ---------- 毎フレーム ---------- */
function tick(){
  drawGuide();renderScan();
  if(busy||!stream||video.readyState<2||!window.ZXingWASM)return;
  var vw=video.videoWidth,vh=video.videoHeight;if(!vw)return;
  full.width=vw;full.height=vh;fctx.drawImage(video,0,0,vw,vh);
  var sc=Math.min(1,1280/Math.max(vw,vh));small.width=Math.round(vw*sc);small.height=Math.round(vh*sc);
  sctx.drawImage(full,0,0,small.width,small.height);
  busy=true;var t0=performance.now();
  ZXingWASM.readBarcodes(sctx.getImageData(0,0,small.width,small.height),{formats:["QRCode"],tryHarder:true,maxNumberOfSymbols:1})
  .then(function(res){
    if(!res||!res.length||!res[0].isValid){busy=false;
      if(token&&!(st.fixed.num&&st.fixed.ord))setStatus(st.qr?"QRが見えていません。ラベルを枠に合わせてください。":"QRを探しています… ラベルを白い枠に合わせ、緑の四角にQRを入れてください。");
      return;}
    var txt=res[0].text;
    /* 認証QR */
    if(/^US-[0-9A-F]{32}$/.test(txt)){busy=false;if(txt!==token)tryToken(txt);return;}
    if(!token){busy=false;setStatus("先に本人用の認証QRを読んでください。","ng");return;}
    var p=res[0].position;var q=[p.topLeft,p.topRight,p.bottomRight,p.bottomLeft].map(function(o){return {x:o.x/sc,y:o.y/sc};});
    lastQuad=q;lastSeen=Date.now();var side=Math.hypot(q[1].x-q[0].x,q[1].y-q[0].y);
    if(st.qr!==txt){
      if(st.qr)log("別のQRを検出したので読み直し");
      resetScan();st.qr=txt;st.pq=parseQR(txt);st.qrAt=Date.now();
      toast(st.pq?"QRを読みました: "+st.pq.pn:"QRを読みました(カートンラベル以外)",st.pq?"ok":"info");
      $("qrLine").textContent=st.pq?("QR: 品番 "+st.pq.pn+" / "+st.pq.name+" / 1番目 "+st.pq.id+" / 日時 "+st.pq.dt+" / TOTAL "+st.pq.total):("QR(カートンラベルの書式ではありません): "+txt);
      log("QR読取 "+(st.pq?st.pq.pn+" "+st.pq.id:txt.slice(0,40)));
      if(st.pq)fillOrders();check();
    }
    if(!st.pq||!workerReady||(st.fixed.num&&st.fixed.ord)){busy=false;
      if(st.pq&&!workerReady)setStatus("QRを読みました。文字認識の準備中…(初回は約6MBを読み込みます)");
      else if(st.fixed.num&&st.fixed.ord)setStatus("QR・カートン番号・下4桁を読みました。範囲を入れて「記録する」を押してください。","ok");
      return;}
    var tq=performance.now();var cn=crop(q,BOX.num),co=crop(q,BOX.ord);
    if(cn)$("numMini").src=cn.toDataURL();if(co)$("ordMini").src=co.toDataURL();
    var p1=(!st.fixed.num&&cn)?ocrOne("num",cn):Promise.resolve(null);
    return p1.then(function(){return (!st.fixed.ord&&co)?ocrOne("ord",co):null;}).then(function(){
      renderScan();
      if(!(st.fixed.num&&st.fixed.ord))setStatus("QR読取済。文字を読んでいます… QR一辺 "+Math.round(side)+"px / "+Math.round(performance.now()-tq)+"ms"+(side<120?"  ※もう少し近づけてください":""),side<120?"ng":"");
      else setStatus("QR・カートン番号・下4桁を読みました。範囲を入れて「記録する」を押してください。","ok");
      busy=false;});
  }).catch(function(e){busy=false;setStatus("エラー: "+(e&&e.message||e),"ng");log("エラー "+(e&&e.message||e));});
}

function setStartBtn(mode){var b=$("start");b.classList.remove("running","working");
  if(mode==="wait"){b.disabled=true;b.classList.add("working");b.innerHTML='<span class="spin"></span>カメラ起動中';}
  else if(mode==="run"){b.disabled=true;b.classList.add("running");b.textContent="● 読取中";}
  else{b.disabled=false;b.textContent="開始";}}
function start(){
  if(stream)return;setStartBtn("wait");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("カメラが使えません(HTTPSで開いているか確認してください)。","ng");return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})
  .then(function(s){stream=s;video.srcObject=s;video.play();setStartBtn("run");
    if(!worker){var bid=busyStart("ocr","文字認識の準備中(初回は約6MB)");prepWorker().then(function(){busyEnd(bid,true);},function(e){busyEnd(bid,false);log("tesseract失敗 "+e);toast("文字認識の準備に失敗","ng","画面を読み込み直してください");});}
    timer=setInterval(tick,200);
    setStatus(token?"カートンラベルを白い枠に合わせてください。":"本人用の認証QRを写してください。");})
  .catch(function(e){setStartBtn("");setStatus("カメラを開始できません: "+e.name,"ng");toast("カメラを開始できません","ng",e.name+"(タップで閉じる)");});
}
function stop(){if(timer){clearInterval(timer);timer=null;}if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}lastQuad=null;drawGuide();setStartBtn("");setStatus("停止中。");}
$("start").addEventListener("click",start);
$("stop").addEventListener("click",stop);
$("rescan").addEventListener("click",function(){resetScan();clearMini();check();setStatus("読み直します。ラベルを枠に合わせてください。");toast("読み直します","info");});
document.addEventListener("visibilitychange",function(){if(document.hidden)stop();});
window.addEventListener("resize",drawGuide);

resetScan();check();
var saved=null;try{saved=localStorage.getItem(TOKEN_KEY);}catch(e){}
if(saved)tryToken(saved);else{setLogin("");setStatus("「開始」を押して、本人用の認証QRを写してください。");}
})();
</script>
